# Three targets: dev on the local warehouse, ci on a synthetic fixture
# warehouse, bq on the BigQuery sandbox for the published aggregates.
drm:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('DRM_DB_PATH', 'data/warehouse.duckdb') }}"
      threads: 4
    ci:
      type: duckdb
      path: data/ci_warehouse.duckdb
      threads: 4
    bq:
      # BigQuery sandbox, personal Google account, no billing (ADR-010).
      # The service-account key lives outside the repository; both values
      # come from the environment. Needs the bq dependency group.
      type: bigquery
      method: service-account
      project: "{{ env_var('DBT_BQ_PROJECT', 'unset') }}"
      keyfile: "{{ env_var('DRM_BQ_KEYFILE', 'unset') }}"
      dataset: drm
      location: EU
      threads: 4
      job_execution_timeout_seconds: 300
