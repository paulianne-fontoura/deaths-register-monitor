name: drm
version: "0.1.0"
profile: drm

model-paths: ["models"]
target-path: target
clean-targets: [target, dbt_packages]

models:
  drm:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate

seeds:
  drm:
    geo_exceptions:
      # varchar keeps the leading zeros ('00000' must not become 0)
      +column_types:
        code_pattern: varchar
        motif: varchar
