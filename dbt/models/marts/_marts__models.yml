version: 2

models:
  - name: dim_geo
    description: >
      Versioned geographic dimension. One row per place code and validity
      period since 1943, as published by the INSEE. A place code of the
      register resolves here at the event date; events before 1943 use the
      earliest known state (rule in docs/le-registre.md).
    columns:
      - name: geo_version_id
        data_tests:
          - unique
          - not_null
      - name: commune_code
        data_tests:
          - not_null
      - name: valid_from
        data_tests:
          - not_null
      - name: scope
        data_tests:
          - accepted_values:
              arguments:
                values: ['metropole_dom', 'outremer_historique']

  - name: dim_pays
    description: Versioned country dimension from the COG countries file.
    columns:
      - name: pays_version_id
        data_tests:
          - unique
          - not_null
      - name: country_code
        data_tests:
          - not_null

  - name: fct_death_records
    description: >
      One row per deduplicated death, current version (grain and rules in
      ADR-008). Published values stay raw, typed columns are null when the
      source is partial, incoherences are flagged and kept under measured
      thresholds. The contract is enforced: the published schema is a
      commitment.
    config:
      contract:
        enforced: true
    columns:
      - name: death_id
        data_type: varchar
        constraints:
          - type: not_null
        data_tests:
          - unique
      - name: record_id
        data_type: varchar
        constraints:
          - type: not_null
        data_tests:
          - unique
      - name: full_name
        data_type: varchar
        constraints:
          - type: not_null
      - name: sex_code
        data_type: varchar
      - name: birth_date
        data_type: date
      - name: birth_date_raw
        data_type: varchar
      - name: birth_place_code
        data_type: varchar
      - name: birth_commune
        data_type: varchar
      - name: birth_country
        data_type: varchar
      - name: death_date
        data_type: date
      - name: death_date_raw
        data_type: varchar
        constraints:
          - type: not_null
      - name: death_place_code
        data_type: varchar
      - name: certificate_number
        data_type: varchar
      - name: geo_version_id
        data_type: varchar
      - name: pays_version_id
        data_type: varchar
      - name: place_resolue
        data_type: boolean
        constraints:
          - type: not_null
      - name: dates_complete
        data_type: boolean
        constraints:
          - type: not_null
      - name: dates_coherentes
        data_type: boolean
        constraints:
          - type: not_null
      - name: n_source_rows
        data_type: bigint
        constraints:
          - type: not_null
      - name: first_published_at
        data_type: date
        constraints:
          - type: not_null
      - name: last_published_at
        data_type: date
        constraints:
          - type: not_null

  - name: fct_record_versions
    description: >
      One row per physical register row, tied to its deduplicated death
      and its delivery (ADR-008). The bitemporal table: late arrivals and
      corrections are read from the deliveries that overlap, loaded with
      drm backfill deaths --all-deliveries.
    config:
      contract:
        enforced: true
    columns:
      - name: death_id
        data_type: varchar
        constraints:
          - type: not_null
      - name: record_id
        data_type: varchar
        constraints:
          - type: not_null
        data_tests:
          - unique
      - name: file_hash
        data_type: varchar
        constraints:
          - type: not_null
      - name: row_hash
        data_type: varchar
        constraints:
          - type: not_null
      - name: period
        data_type: varchar
        constraints:
          - type: not_null
      - name: published_at
        data_type: date
        constraints:
          - type: not_null
      - name: version_rank
        data_type: bigint
        constraints:
          - type: not_null
      - name: is_current
        data_type: boolean
        constraints:
          - type: not_null
      - name: has_corrections
        data_type: boolean
        constraints:
          - type: not_null

  - name: fct_completeness_triangle
    description: >
      One row per death month and per knowledge point (distinct data.gouv
      upload date): how many deaths of that month the public register held
      at that date, and the share of the current total. The table the
      project exists for.
    config:
      contract:
        enforced: true
    columns:
      - name: triangle_id
        data_type: varchar
        constraints:
          - type: not_null
        data_tests:
          - unique
      - name: mois_deces
        data_type: date
        constraints:
          - type: not_null
      - name: published_at
        data_type: date
        constraints:
          - type: not_null
      - name: delai_mois
        data_type: bigint
        constraints:
          - type: not_null
      - name: n_connus
        data_type: bigint
        constraints:
          - type: not_null
      - name: n_total_courant
        data_type: bigint
        constraints:
          - type: not_null
      - name: part_connue
        data_type: double
        constraints:
          - type: not_null

  - name: fct_monthly_quality
    description: >
      Register quality by death month: canonical death count, median delay
      to first publication, deaths known within 30 and 90 days, collapsed
      duplicate rows and silently corrected deaths.
    config:
      contract:
        enforced: true
    columns:
      - name: mois_deces
        data_type: date
        constraints:
          - type: not_null
        data_tests:
          - unique
      - name: n_deces
        data_type: bigint
        constraints:
          - type: not_null
      - name: delai_median_jours
        data_type: bigint
        constraints:
          - type: not_null
      - name: n_connus_30_jours
        data_type: bigint
        constraints:
          - type: not_null
      - name: n_connus_90_jours
        data_type: bigint
        constraints:
          - type: not_null
      - name: n_lignes_repliees
        data_type: bigint
        constraints:
          - type: not_null
      - name: n_deces_corriges
        data_type: bigint
        constraints:
          - type: not_null

  - name: qa_reconciliation
    description: >
      Register death counts by year against the Insee official series and
      the CepiDc all-causes counts, with relative gaps. The perimeters
      differ on purpose (RNIPP registrants vs deaths occurring in France
      vs residents), so the expectation is a small stable positive gap,
      guarded by the singular tests with documented thresholds.
    config:
      contract:
        enforced: true
    columns:
      - name: annee
        data_type: integer
        constraints:
          - type: not_null
        data_tests:
          - unique
      - name: deces_registre
        data_type: bigint
        constraints:
          - type: not_null
      - name: deces_insee
        data_type: bigint
      - name: ecart_insee_pct
        data_type: double
      - name: champ_insee
        data_type: varchar
      - name: statut_insee
        data_type: varchar
      - name: exception_motif
        data_type: varchar
      - name: deces_cepidc
        data_type: bigint
      - name: ecart_cepidc_pct
        data_type: double

  - name: qa_geo_orphelins
    description: >
      Death place codes that do not resolve in dim_geo or dim_pays at the
      event date (pre-1943 events use the earliest known state). One row
      per code with a diagnosis: blank code, known to the referential but
      used outside its validity window, or never published by the COG.
      Documented exceptions live in the geo_exceptions seed.
    columns:
      - name: place_code
        data_tests:
          - unique
          - not_null
      - name: statut
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - 'code_absent'
                  - 'commune_hors_validite'
                  - 'pays_hors_validite'
                  - 'hors_referentiel'
