version: 2

sources:
  - name: exports
    description: >
      Aggregate marts exported from the local warehouse and loaded into
      BigQuery by drm publish (ADR-010). Aggregates only - the nominative
      register never leaves the workstation (ADR-009). The sandbox expires
      every table after 60 days, so freshness errors before that deadline.
    schema: drm_exports
    config:
      loaded_at_field: _exported_at
      freshness:
        warn_after: {count: 35, period: day}
        error_after: {count: 55, period: day}
    tables:
      - name: fct_monthly_quality
        description: Monthly register quality, one row per death month.
      - name: fct_completeness_triangle
        description: Completeness triangle, death month x knowledge point.
      - name: fct_department_quality
        description: Register quality by death department and year.
      - name: qa_reconciliation
        description: Yearly totals against the Insee and CepiDc references.
