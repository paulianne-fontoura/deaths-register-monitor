name: Weekly probe

# Sonde hebdomadaire (ADR-009, etape 11). Le lundi a 06h23 UTC et a la
# demande. Verifie seulement si une livraison est parue ou a ete republiee
# sur data.gouv - elle ouvre l'issue de capture des la semaine ou un
# fichier parait, sans attendre le run mensuel, et applique le controle
# SLA de capture (docs/sla.md). Elle peut signaler un
# incident (API en panne) mais ne ferme jamais les incidents - seul un run
# mensuel vert prouve que le pipeline entier est retabli.

on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: monitoring
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - run: make setup

      - name: Sonde data.gouv
        id: probe
        run: |
          uv run drm probe --json probe-report.json
          echo "new_count=$(jq '.new_deliveries | length' probe-report.json)" >> "$GITHUB_OUTPUT"

      - name: Controle SLA de capture
        run: |
          days=$(jq '.sla_capture_days' probe-report.json)
          breaches=$(jq -r '.sla_breaches | join(", ")' probe-report.json)
          if [ -n "$breaches" ]; then
            echo "SLA de capture depasse - $breaches en attente depuis $days jours ou plus (docs/sla.md, runbook 01)"
            exit 1
          fi
          echo "SLA de capture respecte ($days jours)"

      - name: Issue de capture
        if: always() && steps.probe.outputs.new_count != '' && steps.probe.outputs.new_count != '0'
        run: |
          gh label create capture --force --color D93F0B --description "Livraison data.gouv a capturer"
          {
            echo "La sonde a repere des livraisons non capturees sur data.gouv."
            echo
            jq -r '.new_deliveries[] | "- \(.title) (publiee le \(.published_at), en attente depuis le \(.pending_since))" + (if .replaced_before_capture then " - version initiale du \(.first_published_at) remplacee avant capture, date de connaissance a verifier (runbook 01)" else "" end)' probe-report.json
            echo
            echo "Delai de capture - $(jq '.sla_capture_days' probe-report.json) jours apres la premiere publication (docs/sla.md)."
            echo
            echo "Capture locale - uv run drm backfill deaths --all-deliveries, puis dbt build, puis commit du manifest."
            echo "Fermee automatiquement quand le manifest est a jour. Sonde - ${RUN_URL}"
          } > capture-body.md
          number=$(gh issue list --label capture --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file capture-body.md
          else
            gh issue create --title "Capture requise - nouvelles livraisons data.gouv" --label capture --body-file capture-body.md
          fi

      - name: Cloture des issues de capture
        if: steps.probe.outputs.new_count == '0'
        run: |
          for number in $(gh issue list --label capture --state open --json number --jq '.[].number'); do
            gh issue close "$number" --comment "Manifest a jour - sonde verte ${RUN_URL}"
          done

      - name: Alerte incident
        if: failure()
        run: |
          gh label create incident --force --color B60205 --description "Echec du run planifie"
          {
            echo "La sonde hebdomadaire a echoue."
            echo
            echo "Run - ${RUN_URL}"
            echo "Diagnostic - docs/failure-modes.md, puis le runbook du mode concerne dans docs/runbooks/"
            echo
            echo "Fermee automatiquement au prochain run mensuel vert."
          } > incident-body.md
          number=$(gh issue list --label incident --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file incident-body.md
          else
            gh issue create --title "Incident - echec du run planifie" --label incident --body-file incident-body.md
          fi
