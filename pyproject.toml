[project]
name = "drm"
version = "0.1.0"
description = "Continuous quality audit of the French national death register (INSEE open data)"
readme = "README.md"
authors = [
    { name = "Paulianne Fontoura", email = "pauliannefontoura.contact@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dbt-duckdb>=1.11.0",
    "duckdb>=1.5.5",
    "httpx>=0.28.1",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "tenacity>=9.1.4",
    "typer>=0.27.2",
]

[project.scripts]
drm = "drm.cli:app"

[build-system]
requires = ["uv_build>=0.11.4,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
bq = [
    "dbt-bigquery>=1.12.1",
    "google-cloud-bigquery>=3.45.2",
]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-httpx>=0.36.2",
    "ruff>=0.16.7",
    "sqlfluff>=4.3.0",
]

# The project is developed on Windows and checked in CI on Linux - uv
# must only pick versions that ship wheels for both (a fresh release of
# cryptography once had Linux and macOS wheels only).
[tool.uv]
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.pytest.ini_options]
# the project's tests only, never copies left in ignored local folders
testpaths = ["tests"]
